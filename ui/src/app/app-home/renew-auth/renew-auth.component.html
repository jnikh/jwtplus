<div class="container mt-5 ">
  <h2 >Renew Jwt Token  </h2>
  <form class="mt-4" [formGroup]="authForm" (ngSubmit)="renewAuthToke()">
    <div class="mb-3">
    <label class="form-label">Referesh Token:</label>
    <input formControlName="refresh_token" type="text"  class="form-control" placeholder="Enter Referesh Token " required />
   </div>
   <div class="mb-3">
    <label class="form-label">Ip Address :</label>
    <input formControlName="ip" type="text" class="form-control" placeholder="Enter Ip address" required />
</div>
 <div class="mb-3">
    <label class="form-label">User Agent:</label>
    <input formControlName="useragent" type="text" class="form-control" placeholder="Enter user Agent" required />
</div>
    

    <button type="submit">Generate Tokens</button>
  </form>
  <div *ngIf="responseData">
    <h3>Response:</h3>
    <pre>{{ responseData | json }}</pre>
  </div>
</div>

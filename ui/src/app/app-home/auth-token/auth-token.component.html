<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
    <h2 class="mb-4">Generate Auth & Refresh Tokens</h2>
    <svg  xmlns="http://www.w3.org/2000/svg"  (click)="gotohomePage()" width="35"  height="35"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-chevrons-left " style="cursor: pointer;"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M11 7l-5 5l5 5" /><path d="M17 7l-5 5l5 5" /></svg>
</div>
    <form [formGroup]="authForm" (ngSubmit)="generateTokens()">
        <div class="mb-3">
        <label class="form-label">Subject (sub):</label>
        <input formControlName="sub" class="form-control" id="exampleInputEmail1" type="text" placeholder="Enter subject"  required />
       <small class="text-danger" *ngIf="authForm.controls['sub'].invalid && authForm.controls['sub'].touched">
         sub is required
       </small>
    </div>
      <div class="mb-3">
        <label class="form-label">Audience (aud):</label>
        <input formControlName="aud"  class="form-control" type="text" placeholder="Enter audience" required />
        <small class="text-danger" *ngIf="authForm.controls['aud'].invalid && authForm.controls['aud'].touched">
            Audience is required
          </small>
    </div>
    <div class="mb-3">
        <label class="form-label">IP Address:</label>
        <input formControlName="ip" class="form-control" type="text" placeholder="Enter IP address" required />
        <small class="text-danger" *ngIf="authForm.controls['ip'].invalid && authForm.controls['ip'].touched">
            Ip address is required
          </small>
    </div>
    <div class="mb-3">
        <label class="form-label">User Agent:</label>
        <input formControlName="userAgent" class="form-control" type="text" placeholder="Enter user agent" required /> 
        <small class="text-danger" *ngIf="authForm.controls['userAgent'].invalid && authForm.controls['userAgent'].touched">
            user agent is required
          </small>
    </div>

        <button type="submit" class="btn btn-primary">Generate Tokens</button>
    
    </form>

    <div *ngIf="responseData">
        <h3>Response:</h3>
        <pre>{{ responseData | json }}</pre>
    </div>
</div>

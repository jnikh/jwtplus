<div class="container my-5 ">
    <h2>Verify Auth token</h2>
    <form [formGroup]="authForm" (ngSubmit)="verifyAuthToken()">

        <label class="form-label mb-3">Subject (sub):</label>
        <input formControlName="token" class="form-control" />       

        <button type="submit" class="btn btn-outline-primary">Generate Tokens</button>
    </form>

</div>

<div *ngIf="appdata.length > 0; else loading" class="container">
    <div class="d-flex justify-content-between align-items-center mt-5 mb-4">
        <h2 class="">Public Keys</h2>
        <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="currentColor"  class="icon icon-tabler icons-tabler-filled icon-tabler-backspace"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M20 5a2 2 0 0 1 1.995 1.85l.005 .15v10a2 2 0 0 1 -1.85 1.995l-.15 .005h-11a1 1 0 0 1 -.608 -.206l-.1 -.087l-5.037 -5.04c-.809 -.904 -.847 -2.25 -.083 -3.23l.12 -.144l5 -5a1 1 0 0 1 .577 -.284l.131 -.009h11zm-7.489 4.14a1 1 0 0 0 -1.301 1.473l.083 .094l1.292 1.293l-1.292 1.293l-.083 .094a1 1 0 0 0 1.403 1.403l.094 -.083l1.293 -1.292l1.293 1.292l.094 .083a1 1 0 0 0 1.403 -1.403l-.083 -.094l-1.292 -1.293l1.292 -1.293l.083 -.094a1 1 0 0 0 -1.403 -1.403l-.094 .083l-1.293 1.292l-1.293 -1.292l-.094 -.083l-.102 -.07z" (click)="goToAppHome()" style="cursor: pointer;" /></svg>    </div>
    
    <table class="table table-striped table-bordered table-responsive ">
      <thead>
        <tr>
            <th>Sr.No</th>
          <th>Key ID</th>
          <th>Public Key</th>
          <th>Key Type</th>
          <th>Algo</th>
          <th>Expiry</th>
          <th>Expired</th>
          <th>Revoked</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let key of appdata; let i = index"> 
          <td>{{i+1}}</td>
          <td>{{ key.key_id }}</td>
          <td style="word-break: break-all; max-width: 300px;">{{ key.public_key }}</td>
          <td>{{ key.key_type }}</td>
          <td>{{ key.key_algo }}</td>
          <td>{{ key.exp_time }}</td>
          <td>{{ key.is_expired }}</td>
          <td>{{ key.is_revoked }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <ng-template #loading>
    <p>Loading Pub Keys...</p>
  </ng-template>
